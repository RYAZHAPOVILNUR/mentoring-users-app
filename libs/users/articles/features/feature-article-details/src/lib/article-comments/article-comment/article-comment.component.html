<mat-card class="article-comment">
  <mat-card-header class="article-comment__header">
    <img mat-card-avatar [src]="avatarSrc" alt="author photo" />
    <mat-card-title>{{ comment.author.name }}</mat-card-title>
    <mat-card-subtitle>
      {{ comment.created_at | date: 'MMM d, y, H:mm' }}
    </mat-card-subtitle>
  </mat-card-header>

  <mat-card-content>{{ comment.text }}</mat-card-content>
  <mat-card-actions>
    <button mat-icon-button (click)="onThumbUp()">
      <mat-icon
        [class.article-comment__icon--active]="isLikeActive"
        class="article-comment__icon"
      >
        thumb_up
      </mat-icon>
    </button>
    <span class="article-comment__likes-count" *ngIf="isLikesExists">
      {{ likesCount }}
    </span>

    <button mat-icon-button (click)="onThumbDown()">
      <mat-icon
        [class.article-comment__icon--active]="isDisLikeActive"
        class="article-comment__icon"
      >
        thumb_down
      </mat-icon>
    </button>
    <span class="article-comment__likes-count" *ngIf="isDisLikesExists">
      {{ disLikesCount }}
    </span>
  </mat-card-actions>
</mat-card>
