<div class="article">
  <form [formGroup]="formGroup" class="article__form">
    <mat-form-field
      class="article__mat-field"
      [ngClass]="{
        'article__mat-field--error':
          formGroup.get('title')?.invalid && fieldErrors['title'],
      }"
    >
      <input
        type="text"
        autocomplete="off"
        placeholder="{{ 'ARTICLES.ARTICLE.HEADER' | translate }}"
        formControlName="title"
        matInput
      />
      <mat-error *ngIf="formGroup.get('title')?.invalid && fieldErrors['title']">
        {{ 'ARTICLES.ARTICLE.HEADER_SIZE' | translate }}
      </mat-error>
    </mat-form-field>

    <quill-editor
      class="article__quill-editor"
      [ngClass]="{
        'article__quill-editor--error':
          formGroup.get('textEditor')?.invalid && fieldErrors['textEditor'],
      }"
      [styles]="{ height: '400px' }"
      [modules]="quillEditorModules"
      placeholder=""
      defaultEmptyValue=""
      formControlName="textEditor"
    >
    </quill-editor>

    <mat-error *ngIf="formGroup.get('textEditor')?.invalid && fieldErrors['textEditor']">
      {{ 'ARTICLES.ARTICLE.ARTICLE_SIZE' | translate }}
    </mat-error>

    <div class="article__buttons">
      <button
        color="primary"
        class="article__button article__button--cancel"
        mat-raised-button
        (click)="onCancel()"
      >
        {{ 'ARTICLES.ARTICLE.CLOSE' | translate }}
      </button>
      <button
        color="primary"
        class="article__button article__button--submit"
        mat-raised-button
        (click)="onSubmit()"
      >
        {{
          vm.editMode
            ? ('ARTICLES.ARTICLE.EDIT' | translate)
            : ('ARTICLES.ARTICLE.POST' | translate)
        }}
      </button>
    </div>
  </form>
</div>
