<div class="wrapper">
  <form [formGroup]="formGroup">
    <mat-form-field>
      <input
        type="text"
        autocomplete="off"
        placeholder="{{ 'ARTICLES.ARTICLE.HEADER' | translate }}"
        formControlName="title"
        class="input-field"
        matInput
      />
      <mat-error>
        {{ 'ARTICLES.ARTICLE.HEADER_SIZE' | translate }}
      </mat-error>
    </mat-form-field>

    <div class="custom-input-container">
      <quill-editor
        class="editor"
        [class.light-invalid]="formGroup.get('textEditor')?.invalid && formGroup.get('textEditor')?.touched"
        [styles]="{ height: '400px' }"
        [modules]="quillEditorModules"
        placeholder=""
        defaultEmptyValue="dd"
        formControlName="textEditor"
      >
      </quill-editor>
    </div>

    <p class="error-message" *ngIf="formGroup.get('textEditor')?.invalid && formGroup.get('textEditor')?.touched">
      {{ 'ARTICLES.ARTICLE.ARTICLE_SIZE' | translate }}
    </p>

    <div class="button">
      <button color="primary" mat-raised-button (click)="onSubmit()">
        {{ vm.editMode ? ('ARTICLES.ARTICLE.EDIT' | translate) : ('ARTICLES.ARTICLE.POST' | translate) }}
      </button>
      <button mat-raised-button (click)="onCancel()" color="primary">{{ 'ARTICLES.ARTICLE.CLOSE' | translate }}</button>
    </div>
  </form>
</div>
