<div class="dialog-container">
  <h2 mat-dialog-title>Добавление новой папки</h2>

  <mat-dialog-content>
    <form [formGroup]="folderForm" class="folder-form">
      <mat-form-field appearance="outline" class="full-width">
        <input
          matInput
          formControlName="title"
          placeholder="Введите название папки"
          required
          [errorStateMatcher]="matcher"
        />

        <mat-error *ngIf="title?.hasError('required')">
          Название папки обязательно для заполнения
        </mat-error>
        <mat-error *ngIf="title?.hasError('minlength')">
          Название должно содержать хотя бы 1 символ
        </mat-error>
        <mat-error *ngIf="title?.hasError('maxlength')">
          Название не может превышать 50 символов
        </mat-error>
      </mat-form-field>
    </form>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button (click)="onCancel()">Отмена</button>
    <button
      mat-raised-button
      color="primary"
      (click)="onSave()"
      [disabled]="!folderForm.valid"
    >
      Сохранить
    </button>
  </mat-dialog-actions>
</div>
