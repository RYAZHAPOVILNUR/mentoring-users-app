<ng-container *ngIf="vm.status === 'loading'; else loadingResult">
  <mat-progress-bar color="accent" mode="indeterminate"></mat-progress-bar>
</ng-container>

<ng-template #loadingResult>
  <ng-container *ngIf="vm.status === 'loaded' && vm.user; else error">
    <div class="edit-user-container">
      <mat-card class="edit-user-card">
        <div class="close-button-container">
          <button mat-icon-button aria-label="close dialog" color="accent" (click)="onBackButtonClick()">
            <mat-icon>arrow_back</mat-icon>
          </button>
          <button
            mat-icon-button
            type="button"
            color="accent"
            class="edit-user-button"
            *ngIf="!vm.editMode"
            (click)="onEditButtonClick()"
          >
            <mat-icon>edit</mat-icon>
          </button>
        </div>
        <h3 class="edit-user-title">
          {{ vm.editMode ? 'Редактирование пользователя' : 'Информация пользователя' }}
        </h3>

        <form [formGroup]="userForm" class="user-form">
          <mat-form-field class="edit-user-field">
            <mat-label>Имя:</mat-label>
            <input matInput formControlName="name" placeholder="Имя пользователя" [readonly]="!vm.editMode" />
          </mat-form-field>

          <mat-form-field class="edit-user-field">
            <mat-label>Email:</mat-label>
            <input
              matInput
              formControlName="email"
              placeholder="example@mail.com"
              type="email"
              [readonly]="!vm.editMode"
            />
          </mat-form-field>

          <mat-form-field class="edit-user-field">
            <mat-label>Username:</mat-label>
            <input matInput formControlName="username" placeholder="username" [readonly]="!vm.editMode" />
          </mat-form-field>

          <mat-form-field class="edit-user-field">
            <mat-label>Город:</mat-label>
            <input matInput formControlName="city" placeholder="Город" [readonly]="!vm.editMode" />
          </mat-form-field>
        </form>

        <div class="story-points-section">
          <div *ngIf="!isEditingStoryPoints">
            <mat-form-field class="edit-user-field">
              <mat-label>Количество сторипоинтов:</mat-label>
              <input matInput [value]="storyPointsControl.value" [readonly]="true" class="story-points-display" />

              <button
                mat-icon-button
                matSuffix
                color="primary"
                type="button"
                (click)="startEditStoryPoints()"
                aria-label="Редактировать сторипоинты"
              >
                <mat-icon>add</mat-icon>
              </button>
            </mat-form-field>
          </div>

          <div *ngIf="isEditingStoryPoints">
            <mat-form-field class="edit-user-field">
              <mat-label>Сторипоинты:</mat-label>
              <input
                matInput
                type="number"
                placeholder="0"
                [formControl]="storyPointsControl"
                class="story-points-input"
                min="0"
                step="1"
              />

              <div class="story-points-edit-buttons" matSuffix>
                <button
                  mat-icon-button
                  color="primary"
                  type="button"
                  (click)="confirmStoryPointsEdit()"
                  [disabled]="storyPointsControl.invalid"
                  aria-label="Подтвердить"
                >
                  <mat-icon>check</mat-icon>
                </button>
                <button
                  mat-icon-button
                  color="warn"
                  type="button"
                  (click)="cancelStoryPointsEdit()"
                  aria-label="Отменить"
                >
                  <mat-icon>close</mat-icon>
                </button>
              </div>
            </mat-form-field>
          </div>
        </div>

        <div class="form-actions" *ngIf="vm.editMode">
          <button
            mat-raised-button
            color="primary"
            type="button"
            (click)="saveAllChanges()"
            [disabled]="userForm.invalid"
          >
            Сохранить основные данные
          </button>
          <button mat-button color="warn" type="button" (click)="onCloseButtonClick()">Отмена</button>
        </div>
      </mat-card>
    </div>
  </ng-container>
</ng-template>

<ng-template #error>
  <div class="alert alert-danger" role="alert">
    <h3>Ошибка</h3>
    <hr />
    <p *ngIf="vm.status === 'error'">Произошла ошибка при загрузке данных</p>
    <p *ngIf="vm.status !== 'error'">Данный пользователь не найден</p>
  </div>
</ng-template>
